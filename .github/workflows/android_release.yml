name: Build Android Release (GitHub Hosted)
on:
  push:
    tags:
      - 'android-release-*'
    branches:
      - 'ci/android-release-*'
      - ci/universal-release-*
  workflow_dispatch:
    inputs:
      buildchannel:
        description: 'Build Channel'
        required: true
        default: 'selfhost'
        type: choice
        options:
          - selfhost
          - appstore
  workflow_call:
    secrets:
      RABBY_MOBILE_ANDROID_KEY_STORE:
        required: true
      RABBY_MOBILE_ANDROID_STORE_PASSWORD:
        required: true
      RABBY_MOBILE_ANDROID_KEY_PASSWORD:
        required: true
      RABBY_MOBILE_ANDROID_KEY_ALIAS:
        required: true
      RABBY_MOBILE_KR_PWD:
        required: true

defaults:
  run:
    shell: bash -eol pipefail {0}
env:
  BUILD_TARGET_PLATFORM: android

jobs:
  release-build:
    name: android-release-build
    environment: Production
    runs-on: ubuntu-latest # <-- СБОРКА НА СЕРВЕРАХ GITHUB
    env:
      # Отключаем самописный кэш, будем использовать стандартный actions/cache
      RABBY_MOBILE_NM_USE_CACHE: 'false' 
      RABBY_MOBILE_METRO_NODE_MAX_OLD_SPACE_SIZE: '6144'
      RABBY_MOBILE_METRO_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      # Шаг ручной очистки git УДАЛЕН, он не нужен и опасен на ubuntu-latest

      - name: Get Actions Variables
        id: actionvars
        run: |
          trigger_date=$(date +'%Y%m%d%H%M%S')
          echo "trigger_date=$trigger_date" >> "$GITHUB_OUTPUT"
          flatten_refname=${GITHUB_REF_NAME//\//'_'}
          flatten_refname=${flatten_refname//\./'_'}
          echo "flatten_refname=$flatten_refname" >> "$GITHUB_OUTPUT"

      # --- НАЧАЛО БЛОКА КЭШИРОВАНИЯ ---
      - name: Cache Yarn dependencies
        uses: actions/cache@v3
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      # --- КОНЕЦ БЛОКА КЭШИРОВАНИЯ ---

      - name: Setup Node.js via NVM and Enable Corepack
        run: |
          # Устанавливаем NVM
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
          # Загружаем NVM в текущую сессию терминала
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          
          # Переходим в папку с приложением, где лежит .nvmrc
          cd apps/mobile
          
          # Устанавливаем версию, указанную в .nvmrc (v22)
          nvm install
          nvm use
          
          # Включаем Corepack (для Yarn) от имени только что установленной Node
          corepack enable
          
          # Проверяем, что всё прошло успешно
          echo "Успешно активирован Node: $(node -v)"
          echo "Успешно активирован Yarn: $(yarn -v)"

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1 # Официальный экшен, работает стабильнее на GitHub раннерах
        with:
          ruby-version: '3.3.6'
          bundler-cache: true

      - name: Setup Java
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@7c5672355aaa8fde5f97a91aa9a99616d1ace6bc # v2

      - name: Install & Build app
        run: |
          cd apps/mobile;
          RABBY_MOBILE_RUN_POSTINSTALL=true bash ./scripts/ci/prepare-mobile-build.sh;
          bundle install;

          [ -z $buildchannel ] && export buildchannel=appstore;
          ./scripts/deploy-android.sh
        env:
          FLATTEN_REFNAME: ${{ steps.actionvars.outputs.flatten_refname }}
          TRIGGER_DATE: ${{ steps.actionvars.outputs.trigger_date }}
          REALLY_UPLOAD: 'false'
          RABBY_MOBILE_KR_PWD: ${{ secrets.RABBY_MOBILE_KR_PWD }}
          RABBY_MOBILE_CODE: ${{ secrets.RABBY_MOBILE_CODE2 }}
          RABBY_MOBILE_ANDROID_KEY_STORE: ${{ secrets.RABBY_MOBILE_ANDROID_KEY_STORE }}
          RABBY_MOBILE_ANDROID_STORE_PASSWORD: ${{ secrets.RABBY_MOBILE_ANDROID_STORE_PASSWORD }}
          RABBY_MOBILE_ANDROID_KEY_PASSWORD: ${{ secrets.RABBY_MOBILE_ANDROID_KEY_PASSWORD }}
          RABBY_MOBILE_ANDROID_KEY_ALIAS: ${{ secrets.RABBY_MOBILE_ANDROID_KEY_ALIAS }}
          RABBY_MOBILE_SENTRY_AUTH_TOKEN2: ${{ secrets.RABBY_MOBILE_SENTRY_AUTH_TOKEN2 }}
          SENTRY_AUTH_TOKEN: ${{ secrets.RABBY_MOBILE_SENTRY_AUTH_TOKEN2 }}
          buildchannel: ${{ inputs.buildchannel || 'appstore' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ steps.actionvars.outputs.flatten_refname }}-${{ steps.actionvars.outputs.trigger_date }}
          path: |
            ./apps/mobile/android/app/build/outputs/apk/release/*.apk
            ./apps/mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
          if-no-files-found: error
